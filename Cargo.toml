[package]
name = "mediaflick-desktop"
version = "0.2.1"
edition = "2024"
license = "GPL-2.0-or-later"
publish = false

[[bin]]
name = "mediaflick-desktop"
path = "src/main.rs"

[dependencies]
cef = { version = "=156.7.0", default-features = false }
getrandom = "0.4"
libloading = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# ts-rs prints an unsilenceable "failed to parse serde attribute" note for
# every serde key it skips. `generated_typescript_follows_serde` in
# src/shell/cef/api/wire/guards.rs fails the tests on each skipped key that
# would change the TypeScript, so the notes only repeat accepted cases.
ts-rs = { version = "12.0.1", features = ["no-serde-warnings"] }
roxmltree = "0.21.1"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ureq = { version = "3.5.2", features = ["json"] }
rusqlite = { version = "0.43", features = ["bundled", "functions"] }
clap = { version = "4", default-features = false, features = [
    "std",
    "env",
    "help",
    "usage",
    "error-context",
] }
tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }

[lints.rust]
warnings = "deny"

[lints.clippy]
allow_attributes_without_reason = "forbid"
panic = "forbid"
unreachable = "forbid"
all = { level = "deny", priority = -1 }
assigning_clones = "forbid"
cognitive_complexity = "forbid"
dbg_macro = "forbid"
expect_used = "forbid"
fn_params_excessive_bools = "forbid"
large_futures = "forbid"
needless_pass_by_value = "forbid"
option_option = "forbid"
redundant_clone = "forbid"
significant_drop_tightening = "forbid"
todo = "forbid"
too_many_lines = "forbid"
undocumented_unsafe_blocks = "forbid"
unimplemented = "forbid"
unwrap_used = "forbid"

[dev-dependencies]
proptest = "1"
sha2 = "0.11"
syn = { version = "3", features = ["full", "visit"] }

[target.'cfg(target_os = "windows")'.dependencies]
sevenz-rust2 = { version = "0.25", default-features = false, features = ["util"] }
windows = { version = "0.62", features = [
    "Foundation",
    "Media",
    "Media_Playback",
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_DirectComposition",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_Environment",
    "Win32_System_JobObjects",
    "Win32_System_LibraryLoader",
    "Win32_System_Power",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_Storage_FileSystem",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

# The fake mpv IPC server in tests creates named pipes.
[target.'cfg(target_os = "windows")'.dev-dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Security",
    "Win32_System_IO",
    "Win32_System_Pipes",
] }

[target.'cfg(target_os = "windows")'.build-dependencies]
winresource = "0.1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSEvent", "NSMenu", "NSMenuItem", "NSResponder"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString"] }

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.14", features = ["xkb", "resource_manager"] }
wayland-client = "0.31"
wayland-server = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "server", "staging", "unstable"] }
xkbcommon-dl = "0.4"
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
