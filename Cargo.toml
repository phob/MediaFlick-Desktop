[package]
name = "mediaflick-desktop"
version = "0.1.6"
edition = "2024"
license = "GPL-2.0-or-later"
publish = false

[[bin]]
name = "mediaflick-desktop"
path = "src/main.rs"

[dependencies]
cef = { version = "=154.0.0", default-features = false }
getrandom = "0.4"
libloading = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
roxmltree = "0.21.1"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ureq = { version = "3", features = ["json"] }
rusqlite = { version = "0.40", features = ["bundled"] }
clap = { version = "4", default-features = false, features = [
    "std",
    "derive",
    "env",
    "help",
    "usage",
    "error-context",
] }
tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }

[lints.rust]
warnings = "deny"

[lints.clippy]
all = "deny"
assigning_clones = "deny"
cognitive_complexity = "deny"
dbg_macro = "deny"
expect_used = "deny"
fn_params_excessive_bools = "deny"
large_futures = "deny"
needless_pass_by_value = "deny"
option_option = "deny"
redundant_clone = "deny"
significant_drop_tightening = "deny"
todo = "deny"
too_many_lines = "deny"
undocumented_unsafe_blocks = "deny"
unimplemented = "deny"
unwrap_used = "deny"

[target.'cfg(target_os = "windows")'.dependencies]
sevenz-rust2 = { version = "0.22", default-features = false, features = ["util"] }
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_DirectComposition",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Environment",
    "Win32_System_JobObjects",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_Storage_FileSystem",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

# The fake mpv IPC server in tests creates named pipes.
[target.'cfg(target_os = "windows")'.dev-dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Security",
    "Win32_System_IO",
    "Win32_System_Pipes",
] }

[target.'cfg(target_os = "windows")'.build-dependencies]
winresource = "0.1"

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.14", features = ["xkb", "resource_manager"] }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "unstable"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
