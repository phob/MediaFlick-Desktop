[package]
name = "mediaflick-desktop"
version = "0.1.6"
edition = "2024"
license = "GPL-2.0-or-later"
publish = false

[[bin]]
name = "mediaflick-desktop"
path = "src/main.rs"

[dependencies]
cef = { version = "=151.8.1", default-features = false }
getrandom = "0.4"
libloading = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
roxmltree = "0.21.1"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ureq = { version = "3", features = ["json"] }
# 0.40 pulls libsqlite3-sys 0.38.1, whose build script needs a newer Rust than
# this project's toolchain. Revisit once the toolchain moves past 1.93.
rusqlite = { version = "0.40", features = ["bundled"] }
clap = { version = "4", default-features = false, features = [
    "std",
    "derive",
    "env",
    "help",
    "usage",
    "error-context",
] }
tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }

[lints.rust]
warnings = "deny"

[lints.clippy]
all = "deny"
assigning_clones = "deny"
cognitive_complexity = "deny"
dbg_macro = "deny"
expect_used = "deny"
fn_params_excessive_bools = "deny"
large_futures = "deny"
needless_pass_by_value = "deny"
option_option = "deny"
redundant_clone = "deny"
significant_drop_tightening = "deny"
todo = "deny"
too_many_lines = "deny"
unimplemented = "deny"
unwrap_used = "deny"

[target.'cfg(target_os = "windows")'.dependencies]
sevenz-rust2 = { version = "0.22", default-features = false, features = ["util"] }
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_DirectComposition",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_DataExchange",
    "Win32_System_Environment",
    "Win32_System_JobObjects",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_Storage_FileSystem",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "windows")'.build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
