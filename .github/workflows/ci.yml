name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_TARGET_DIR: build/cargo-target

jobs:
  source-quality:
    name: Source quality
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Check Linux libmpv packaging
        run: |
          sudo apt-get update
          sudo apt-get install -y patchelf shellcheck
          shellcheck distribution/libmpv/linux/build.sh distribution/linux/build-appimage.sh
          python3 -m unittest discover -s distribution/libmpv/linux -p 'test_*.py'

  ui:
    name: UI
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: ui/package.json

      - name: Install Node toolchain
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - name: Install UI dependencies
        run: pnpm --dir ui install --frozen-lockfile

      - name: Lint UI
        run: pnpm --dir ui lint

      # `pnpm build` runs `tsc -b` before the Vite bundle.
      - name: Type-check and build UI
        run: pnpm --dir ui build

      - name: Test UI
        run: pnpm --dir ui test

      - name: Check that pnpm left the lockfile unchanged
        run: git diff --exit-code ui/pnpm-lock.yaml

  build-and-test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        # phob-authored PRs, which include every agent PR, build on Ubuntu only;
        # clippy-cross catches their Windows and macOS compile errors. Check the
        # author, not the actor who pushes or reruns a workflow.
        os: ${{ fromJSON(github.event_name == 'pull_request' && github.event.pull_request.user.login == 'phob' && '["ubuntu-24.04"]' || '["ubuntu-24.04", "windows-latest", "macos-15"]') }}

    env:
      CEF_PATH: ${{ github.workspace }}/../mediaflick-cache/cef
      MACOSX_DEPLOYMENT_TARGET: "11.0"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # The UI bundle is embedded in the binary, so every Rust job needs it.
      # build.rs shells out to pnpm unless MEDIAFLICK_DESKTOP_SKIP_UI_BUILD=1.
      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: ui/package.json

      - name: Install Node toolchain
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - name: Cache Cargo and CEF downloads
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ env.CEF_PATH }}
          key: ci-${{ matrix.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ci-${{ matrix.os }}-

      - name: Install UI dependencies
        run: pnpm --dir ui install --frozen-lockfile

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            curl \
            file \
            libasound2-dev \
            libgtk-3-dev \
            libnss3-dev \
            libx11-dev \
            libx11-xcb-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxcb1-dev \
            libxcomposite-dev \
            libxcursor-dev \
            libxdamage-dev \
            libxext-dev \
            libxfixes-dev \
            libxi-dev \
            libxrandr-dev \
            libxrender-dev \
            libxtst-dev \
            ninja-build

      - name: Install Windows build dependencies
        if: runner.os == 'Windows'
        run: choco install ninja --yes --no-progress

      - name: Install macOS build dependencies
        if: runner.os == 'macOS'
        run: brew install cmake ninja

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked --all-targets

      # Guard integrity reads the untyped-body count as text; this proves its
      # test is still compiled and registered, whatever surrounds its module.
      - name: Check that the untyped-body count runs
        shell: bash
        run: |
          cargo test --locked --bin mediaflick-desktop -- --list \
            | grep -Fx 'shell::cef::api::wire::untyped_count::untyped_responses_only_shrink: test'

      - name: Build
        run: cargo build --locked --bin mediaflick-desktop

  clippy-cross:
    name: Clippy (${{ matrix.name }} target)
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            target: x86_64-pc-windows-msvc
          - name: macOS
            target: aarch64-apple-darwin

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      # Run in the checkout so rustup adds the target to the toolchain that
      # rust-toolchain.toml pins, not to `stable`.
      - name: Install Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: ui/package.json

      - name: Install Node toolchain
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
          workspaces: ". -> build/cargo-target"

      # build.rs embeds the bundle; clippy-target expects it already built.
      - name: Build UI bundle
        run: just ui

      - name: Clippy
        run: just clippy-target ${{ matrix.target }}

  plugin:
    name: Companion plugin
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Test
        run: dotnet test --project plugin/tests/Jellyfin.Plugin.MediaFlick.Tests/Jellyfin.Plugin.MediaFlick.Tests.csproj --configuration Release

      - name: Publish
        run: dotnet publish plugin/src/Jellyfin.Plugin.MediaFlick/Jellyfin.Plugin.MediaFlick.csproj --configuration Release --output plugin/bin/Release/publish

  ci:
    name: CI
    # Runs even when a needed job fails, so a failed, cancelled, or skipped job
    # turns this required check red instead of leaving it skipped.
    if: ${{ always() }}
    needs: [source-quality, ui, build-and-test, clippy-cross, plugin]
    runs-on: ubuntu-latest
    steps:
      - name: Verify required jobs succeeded
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "$RESULTS"
          if [ "$(jq '[.[] | select(. != "success")] | length' <<< "$RESULTS")" != 0 ]; then
            echo "One or more required CI jobs did not succeed."
            exit 1
          fi
