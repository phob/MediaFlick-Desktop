name: Companion Release

# Two steps, run in order for each Companion version:
#   1. Run this workflow with step `draft`. It tests, packages and creates a
#      draft release `companion-v<version>` with --latest=false.
#   2. A maintainer tests the draft and publishes it, with "Set as the latest
#      release" unchecked (the Latest Release Guard repairs and flags a slip).
#      Publishing runs the `repository` step, which adds the published package
#      to website/public/companion/manifest.json (https://flick.media/companion/manifest.json)
#      on a branch and links a ready pull request in the run summary. Run it by
#      hand with step `repository` if the release event did not.
# There is no tag trigger: publishing a draft creates its tag, and a tag
# trigger would then try to draft the same release again.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Companion version (three or four numeric components)"
        required: true
        type: string
      step:
        description: "draft: build a draft release. repository: add a published release to the flick.media manifest"
        type: choice
        options: [draft, repository]
        default: draft

permissions:
  contents: write

concurrency:
  group: companion-release
  cancel-in-progress: false

jobs:
  draft:
    if: github.event_name == 'workflow_dispatch' && inputs.step == 'draft'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Prepare version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          version="$INPUT_VERSION"
          if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(\.(0|[1-9][0-9]*))?$ ]]; then
            echo "Jellyfin requires three or four numeric version components." >&2
            exit 1
          fi
          assembly_version="$version"
          if [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            assembly_version="${version}.0"
          fi
          {
            echo "version=$version"
            echo "assembly_version=$assembly_version"
            echo "tag=companion-v$version"
          } >> "$GITHUB_OUTPUT"

      - name: Install .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Test plugin and package tooling
        run: |
          dotnet test --project plugin/tests/Jellyfin.Plugin.MediaFlick.Tests/Jellyfin.Plugin.MediaFlick.Tests.csproj --configuration Release
          python3 -m unittest discover -s plugin -p 'test_*.py'

      - name: Publish versioned plugin
        env:
          VERSION: ${{ steps.version.outputs.version }}
          ASSEMBLY_VERSION: ${{ steps.version.outputs.assembly_version }}
        run: |
          dotnet publish plugin/src/Jellyfin.Plugin.MediaFlick/Jellyfin.Plugin.MediaFlick.csproj \
            --configuration Release --output plugin/bin/Release/publish \
            -p:Version="$VERSION" -p:AssemblyVersion="$ASSEMBLY_VERSION" -p:FileVersion="$ASSEMBLY_VERSION"

      - name: Verify compiled version
        shell: pwsh
        env:
          ASSEMBLY_VERSION: ${{ steps.version.outputs.assembly_version }}
        run: |
          $assembly = [System.Reflection.AssemblyName]::GetAssemblyName("$PWD/plugin/bin/Release/publish/Jellyfin.Plugin.MediaFlick.dll")
          if ($assembly.Version.ToString() -ne $env:ASSEMBLY_VERSION) {
            throw "Compiled plugin version does not match release version."
          }

      - name: Package plugin
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python3 plugin/package.py build \
            --version "$VERSION" \
            --publish-dir plugin/bin/Release/publish \
            --output-dir plugin/bin/Release/package \
            --changelog "MediaFlick Companion ${VERSION}: calendar, requests, ratings, and collections."

      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "$TAG" \
            --draft --latest=false --target "$GITHUB_SHA" \
            --title "MediaFlick Companion v${VERSION}" \
            --notes "MediaFlick Companion ${VERSION}. Requires Jellyfin 12.0.0 or newer. Install it from https://flick.media/companion/ once published. When publishing, leave 'Set as the latest release' unchecked." \
            "plugin/bin/Release/package/mediaflick-companion_${VERSION}.zip" \
            plugin/bin/Release/package/meta.json

  repository:
    if: >-
      (github.event_name == 'release' && startsWith(github.event.release.tag_name, 'companion-v') && !github.event.release.prerelease)
      || (github.event_name == 'workflow_dispatch' && inputs.step == 'repository')
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          # The manifest entry lands on the default branch, whatever commit the release tagged.
          ref: ${{ github.event.repository.default_branch }}

      - name: Prepare version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        shell: bash
        run: |
          set -euo pipefail
          version="${INPUT_VERSION:-${RELEASE_TAG#companion-v}}"
          if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(\.(0|[1-9][0-9]*))?$ ]]; then
            echo "Jellyfin requires three or four numeric version components." >&2
            exit 1
          fi
          {
            echo "version=$version"
            echo "tag=companion-v$version"
            echo "branch=companion-repository/v$version"
          } >> "$GITHUB_OUTPUT"

      # package.py downloads the asset without credentials, so a draft (404)
      # or a missing asset fails here and never reaches the manifest.
      - name: Add the published package to the manifest
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          python3 plugin/package.py add \
            --source-url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/mediaflick-companion_${VERSION}.zip" \
            --manifest website/public/companion/manifest.json

      # Actions may not open pull requests in this repository, and a pull
      # request opened by the workflow token would not run the required checks.
      # The branch is pushed and the summary links a pull request to open.
      - name: Push the manifest branch
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BRANCH: ${{ steps.version.outputs.branch }}
          BASE: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --create "$BRANCH"
          git commit --all --message "feat(companion): list Companion ${VERSION} in the flick.media repository"
          git push --force origin "HEAD:refs/heads/${BRANCH}"
          title="feat(companion): list Companion ${VERSION} in the flick.media repository"
          link="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/${BASE}...${BRANCH}?quick_pull=1&title=$(jq -rn --arg t "$title" '$t|@uri')"
          {
            echo "### Companion ${VERSION} is ready for the repository"
            echo
            echo "Open the pull request: ${link}"
            echo
            echo "It adds ${VERSION} to website/public/companion/manifest.json. Once merged and deployed, Jellyfin servers with the repository https://flick.media/companion/manifest.json offer the update."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=Open the manifest pull request::${link}"
